name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy packages services apps
      - name: Pytest
        run: uv run pytest

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    env:
      # dbt parse does not connect to BigQuery; a placeholder satisfies the
      # required env var without publishing the real project id.
      GCP_PROJECT_ID: ci-parse-only
      DBT_PROFILES_DIR: transform/dbt
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --frozen
      - name: dbt deps + parse (Fusion v2)
        working-directory: transform/dbt
        run: |
          uv run dbt deps
          uv run dbt parse

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check (informational)
        run: terraform fmt -check -diff -recursive
        continue-on-error: true
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

  secrets-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
