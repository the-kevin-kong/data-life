[project]
name = "dashboard"
version = "0.1.0"
description = "Streamlit dashboard over the BigQuery marts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dl-common",
    "streamlit>=1.38",
    "plotly>=5.24",
    "pandas>=2.2",
    "db-dtypes>=1.3",
    "st-rsuite>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_dashboard"]
