[project]
name = "dl-common"
version = "0.1.0"
description = "Shared platform utilities: settings, logging, BigQuery, Secret Manager."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "google-cloud-bigquery>=3.25",
    "google-cloud-secret-manager>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_common"]
