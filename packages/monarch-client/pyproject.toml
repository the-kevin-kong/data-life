[project]
name = "dl-monarch"
version = "0.1.0"
description = "Automated auth + typed access over the monarchmoney fork."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dl-common",
    # Maintained community fork; current api.monarch.com. Imports as `monarchmoney`.
    "monarchmoneycommunity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_monarch"]

[tool.hatch.metadata]
# Allow the monarchmoney git dependency (resolved via the workspace source).
allow-direct-references = true
