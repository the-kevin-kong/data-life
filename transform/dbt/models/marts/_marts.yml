version: 2

models:
  - name: fct_transactions
    description: Transaction fact enriched with account and category attributes.
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: amount
        data_tests: [not_null]

  - name: dim_accounts
    columns:
      - name: account_id
        data_tests: [not_null, unique]

  - name: dim_categories
    columns:
      - name: category_id
        data_tests: [not_null, unique]

  - name: mart_monthly_spending
    description: Monthly spend/income rollup by category group.
    columns:
      - name: month
        data_tests: [not_null]
