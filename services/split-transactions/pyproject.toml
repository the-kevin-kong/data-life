[project]
name = "split-transactions"
version = "0.1.0"
description = "Cloud Run Job: split tagged Monarch transactions into predetermined legs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dl-common",
    "dl-monarch",
    "pydantic>=2.8",
    "PyYAML>=6",
]

[project.scripts]
split-transactions = "dl_splitter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dl_splitter"]
