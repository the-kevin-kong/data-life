[project]
name = "data-life"
version = "0.1.0"
description = "Personal data platform: Monarch Money -> BigQuery -> reports, plus automated transaction splitting."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kevin" }]
# The workspace root is an umbrella that depends on every member, so a bare
# `uv sync` / `uv run` installs the full graph into .venv (keeping the editor's
# environment complete and stable). Per-service Docker builds still use
# `uv sync --package <name>` to install only what that image needs.
dependencies = [
    "dl-common",
    "dl-monarch",
    "ingest-monarch",
    "split-transactions",
    "dashboard",
]

[tool.uv.workspace]
members = ["packages/*", "services/*", "apps/*"]

# Resolve workspace members to local code; the Monarch client comes from
# Kevin's fork.
[tool.uv.sources]
dl-common = { workspace = true }
dl-monarch = { workspace = true }
ingest-monarch = { workspace = true }
split-transactions = { workspace = true }
dashboard = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "types-PyYAML>=6",
    # dbt Core v2.0 via the Fusion distribution (bundles the BigQuery adapter;
    # there is no dbt-bigquery v2). Prerelease specifier lets uv pick the RC.
    # Invoked as a CLI from transform/dbt so `uv run dbt ...` works.
    "dbt>=2.0.0rc196",
]

# ---------------------------------------------------------------------------
# Tooling config shared across every workspace member.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "services", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
# Third-party libraries without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = [
    "monarchmoney",
    "monarchmoney.*",
    "pandas",
    "pandas.*",
    "plotly",
    "plotly.*",
    "db_dtypes",
    "db_dtypes.*",
    "st_rsuite",
    "st_rsuite.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services", "apps"]
addopts = "-ra"
